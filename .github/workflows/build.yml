name: Build HiSilicon Kernel with Docker Support

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      run: |
        git clone --depth=1 https://github.com/leandrotsampa/hisilicon-kernel.git
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev xz-utils
        
    - name: Configure Kernel
      run: |
        cd hisilicon-kernel
        # Load the base defconfig for Hi3798MV200 Android
        make ARCH=arm hi3798mv200_android_defconfig
        
        # Inject Docker, LXC, and Isolation features
        cat <<EOF >> .config
        CONFIG_NAMESPACES=y
        CONFIG_UTS_NS=y
        CONFIG_IPC_NS=y
        CONFIG_USER_NS=y
        CONFIG_PID_NS=y
        CONFIG_NET_NS=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_DEBUG=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CPUSETS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_MEMCG=y
        CONFIG_MEMCG_SWAP=y
        CONFIG_MEMCG_KMEM=y
        CONFIG_CGROUP_PERF=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_FAIR_GROUP_SCHED=y
        CONFIG_RT_GROUP_SCHED=y
        CONFIG_BLK_CGROUP=y
        CONFIG_NET_CLS_CGROUP=y
        CONFIG_CGROUP_NET_PRIO=y
        CONFIG_VETH=y
        CONFIG_MACVLAN=y
        CONFIG_BRIDGE=y
        CONFIG_OVERLAY_FS=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP_NF_NAT=y
        CONFIG_NF_NAT=y
        EOF
        
        # Apply the new configs
        make ARCH=arm olddefconfig
        
    - name: Compile Kernel
      run: |
        cd hisilicon-kernel
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS="-fcommon" KBUILD_HOSTCFLAGS="-fcommon" EXTRA_CFLAGS="-fcommon" -j$(nproc) zImage
        
    - name: Upload zImage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Compiled_Kernel_zImage
        path: hisilicon-kernel/arch/arm/boot/zImage
