name: Build HiSilicon Kernel with Docker Support

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout User Repository
      uses: actions/checkout@v4

    - name: Checkout Kernel Source
      run: |
        git clone --depth=1 https://github.com/leandrotsampa/hisilicon-kernel.git
        cp kernel_backup.zip hisilicon-kernel/
        
    - name: Compile Kernel inside Ubuntu 14.04 Docker Container
      run: |
        docker run -v $(pwd)/hisilicon-kernel:/work -w /work ubuntu:14.04 bash -c "
        echo 'deb http://old-releases.ubuntu.com/ubuntu/ trusty main universe' > /etc/apt/sources.list &&
        echo 'deb http://old-releases.ubuntu.com/ubuntu/ trusty-updates main universe' >> /etc/apt/sources.list &&
        apt-get update && 
        apt-get install -y gcc-arm-linux-gnueabihf build-essential bc libssl-dev libncurses5-dev bison flex libelf-dev unzip abootimg && 
        
        echo 'Extracting factory config...' &&
        unzip -q kernel_backup.zip &&
        dd if=kernel_backup.img of=real_boot.img bs=8192 skip=1 &&
        abootimg -x real_boot.img &&
        (scripts/extract-ikconfig zImage > .config || make ARCH=arm hi3798mv200_android_defconfig) &&
        
        echo 'Patching C errors...' &&
        sed -i 's/SDCARDFS_VERSION/\"1.0\"/g' fs/sdcardfs/main.c &&
        ./scripts/config --disable CONFIG_USB_GADGET &&
        ./scripts/config --disable CONFIG_USB_HIUDC &&
        ./scripts/config --disable CONFIG_USB_DWC2 &&
        
        echo 'Injecting Docker requirements...' &&
        echo 'CONFIG_NAMESPACES=y' >> .config &&
        echo 'CONFIG_UTS_NS=y' >> .config &&
        echo 'CONFIG_IPC_NS=y' >> .config &&
        echo 'CONFIG_USER_NS=y' >> .config &&
        echo 'CONFIG_PID_NS=y' >> .config &&
        echo 'CONFIG_NET_NS=y' >> .config &&
        echo 'CONFIG_CGROUPS=y' >> .config &&
        echo 'CONFIG_CGROUP_DEBUG=y' >> .config &&
        echo 'CONFIG_CGROUP_FREEZER=y' >> .config &&
        echo 'CONFIG_CGROUP_DEVICE=y' >> .config &&
        echo 'CONFIG_CPUSETS=y' >> .config &&
        echo 'CONFIG_CGROUP_CPUACCT=y' >> .config &&
        echo 'CONFIG_MEMCG=y' >> .config &&
        echo 'CONFIG_MEMCG_SWAP=y' >> .config &&
        echo 'CONFIG_MEMCG_KMEM=y' >> .config &&
        echo 'CONFIG_CGROUP_PERF=y' >> .config &&
        echo 'CONFIG_CGROUP_SCHED=y' >> .config &&
        echo 'CONFIG_FAIR_GROUP_SCHED=y' >> .config &&
        echo 'CONFIG_RT_GROUP_SCHED=y' >> .config &&
        echo 'CONFIG_BLK_CGROUP=y' >> .config &&
        echo 'CONFIG_NET_CLS_CGROUP=y' >> .config &&
        echo 'CONFIG_CGROUP_NET_PRIO=y' >> .config &&
        echo 'CONFIG_VETH=y' >> .config &&
        echo 'CONFIG_MACVLAN=y' >> .config &&
        echo 'CONFIG_BRIDGE=y' >> .config &&
        echo 'CONFIG_OVERLAY_FS=y' >> .config &&
        echo 'CONFIG_IP_NF_FILTER=y' >> .config &&
        echo 'CONFIG_IP_NF_TARGET_MASQUERADE=y' >> .config &&
        echo 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' >> .config &&
        echo 'CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y' >> .config &&
        echo 'CONFIG_NETFILTER_XT_MATCH_IPVS=y' >> .config &&
        echo 'CONFIG_IP_NF_NAT=y' >> .config &&
        echo 'CONFIG_NF_NAT=y' >> .config &&
        
        make ARCH=arm olddefconfig && 
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=\"-fcommon\" KBUILD_HOSTCFLAGS=\"-fcommon\" EXTRA_CFLAGS=\"-fcommon\" -j\$(nproc) zImage &&
        
        echo 'Injecting new kernel into factory boot.img...' &&
        dd if=kernel_backup.img of=advca_header.bin bs=8192 count=1 &&
        cp real_boot.img modified_boot.img &&
        abootimg -u modified_boot.img -k arch/arm/boot/zImage &&
        cat advca_header.bin modified_boot.img > new_boot.img
        "

    - name: Upload new_boot.img Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Final_Boot_Image
        path: hisilicon-kernel/new_boot.img
